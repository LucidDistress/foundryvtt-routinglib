name: Validate routinglib
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: JavaScript regression tests
        run: node --test tests/*.test.mjs
      - name: Set up Rust and wasm-pack
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Native Rust regression tests
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Build and validate release archive
        run: python3 build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: routinglib-test-build-${{ github.sha }}
          path: artifact/*.zip
          if-no-files-found: error
          retention-days: 14
